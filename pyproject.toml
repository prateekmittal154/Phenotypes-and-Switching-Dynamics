[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cancer-lineage-state-dynamics"
version = "1.0.0"
description = "Phenotypic inheritance, state occupancy and switching dynamics in cancer lineage tracing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Prateek Mittal" }]
keywords = ["lineage-tracing", "cancer-evolution", "identifiability",
            "cell-state-plasticity", "phylogenetics"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
notebooks = ["jupyter", "nbformat", "nbclient"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/REPLACE_OWNER/cancer-lineage-state-dynamics"

# The analysis modules import as `src.*` and `experiments.*`. That is the archived,
# verified layout used for the paper; renaming it would have meant editing ~50 validated
# files. Installing both as top-level packages keeps every script byte-identical.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
